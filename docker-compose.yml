# 本地 / 私有化 Docker 部署编排。
# 首次部署： cp .env.example .env 并填好强密码，然后 docker compose up -d --build
# 敏感项（数据库口令、AI Key）一律走 .env，不要写死在文件里。

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # 根库与业务库只在本 compose 内部网络按服务名( mysql )可达，不对宿主机暴露端口。
      MYSQL_DATABASE: sk_agent
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      # 自动创建业务账号并仅授予 sk_agent 库权限（应用用最小权限账号，而非 root）
      MYSQL_USER: ${MYSQL_USER:-sk_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}
    # 数据持久化到命名卷，容器重建不丢数据
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sk_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      # 应用以最小权限业务账号连接，而不是数据库 root
      DB_USERNAME: ${MYSQL_USER:-sk_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
    ports:
      - "8080:8080"

volumes:
  mysql-data: