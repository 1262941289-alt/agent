server:
  port: 8080

spring:
  application:
    name: sk-agent
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/sk_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  ai:
    # 关闭 @Tool 方法的全局自动注册，由各阶段 ChatClient 显式绑定工具
    tool-callbacks:
      auto-register: false
    retry:
      # 关闭 Spring AI 内置重试（默认 max-attempts=10），统一交由 sk-agent.llm.retry 的 RetryingChatModel 做 provider 级退避
      max-attempts: 1
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.1
          max-tokens: 2048

# 筛选框架配置（可随业务调整）
sk-agent:
  filter:
    layers:
      - code: L1
        name: 高风险层
        description: 存在明显重大风险、数据异常或涉及敏感要素的数据
        order: 1
      - code: L2
        name: 中风险层
        description: 存在部分风险特征、需要重点关注的异常数据
        order: 2
      - code: L3
        name: 低风险层
        description: 风险特征不明显、基本正常的数据
        order: 3
    attributes:
      - key: 金额
        description: 涉及金额，单位元；无金额填"无"
      - key: 地区
        description: 数据所属地区或国家
      - key: 主体类型
        description: 数据主体的类型，如个人/企业/机构等
      - key: 风险特征
        description: 数据中体现的风险点简述
    rules:
      - id: R1
        action: REJECT
        priority: 1
        description: 若数据项被划分为 L1 高风险层，则直接拒绝
      - id: R2
        action: REJECT
        priority: 2
        description: 若数据项金额超过 500000 元（50 万），则拒绝
      - id: R3
        action: REJECT
        priority: 3
        description: 若数据项地区为"高风险地区"或"未知/境外敏感地区"，则拒绝
      - id: R4
        action: PASS
        priority: 4
        description: 其余情况一律通过
  browser:
    # 是否无头运行；台账验收需要人可观察、可介入登录，默认有头
    headless: false
    # 复用系统已安装的 Edge，避免下载 Chromium
    channel: msedge
    # 持久化用户数据目录：登录态（如 GitHub）跨启动保留
    profile-dir: ${user.dir}/target/playwright-profile
  # 文件系统工具策略（参考 deepseek-harness fs-sandbox）
  #   mode: read-only —— 禁止写入；workspace-write —— 仅 workspace 目录内可写；full-access —— 不限制
  fs:
    workspace-root: ${user.dir}
    mode: workspace-write
  # 用友 U9 登录凭据（供浏览器 agent 自动登录；账号/密码来自 local/secret.env 的 U9_ACCOUNT / U9_PASSWORD）
  u9:
    account: ${U9_ACCOUNT:}
    password: ${U9_PASSWORD:}
  # 备用模型通道：硅基流动（SiliconFlow）。切换后备时把 spring.ai.openai.base-url 换成 ${SF_BASE_URL}，
  # api-key 换成 ${SF_API_KEY:}，并把 ai.openai.chat.options.model 换成兼容模型名。
  sf:
    base-url: ${SF_BASE_URL:https://api.siliconflow.cn}
    api-key: ${SF_API_KEY:}
  # provider 级 LLM 重试（照搬 deepseek-harness llm-retry：指数退避 + 抖动）
  llm:
    retry:
      enabled: true
      mode: normal          # normal=仅网络态瞬断（DNS/连接/超时）；always=网络态+可识别状态码
      initial-delay-ms: 500
      max-delay-ms: 8000
      jitter-ratio: 0.25
      max-retries: 3
      retryable-codes: [429, 500, 502, 503, 504]
    # LLM 账号池：多 key 主备降级，单账号连续失败熔断后自动切下一个
    pool:
      enabled: true
      strategy: failover      # failover=主备固定顺序；round-robin=轮询分摊
      max-consecutive-failures: 3
      cooldown-ms: 30000      # 熔断冷却 30s
      accounts:
        - name: deepseek-primary
          base-url: ${AI_BASE_URL:https://api.deepseek.com}
          api-key: ${AI_API_KEY:}
          model: ${AI_MODEL:deepseek-chat}
        - name: sf-backup-1
          base-url: ${SF_BASE_URL:https://api.siliconflow.cn}
          api-key: ${SF_API_KEY_1:}
          model: deepseek-ai/DeepSeek-V4-Flash
        - name: sf-backup-2
          base-url: ${SF_BASE_URL:https://api.siliconflow.cn}
          api-key: ${SF_API_KEY_2:}
          model: deepseek-ai/DeepSeek-V4-Flash
        - name: sf-backup-3
          base-url: ${SF_BASE_URL:https://api.siliconflow.cn}
          api-key: ${SF_API_KEY_3:}
          model: deepseek-ai/DeepSeek-V4-Flash
  # 工具守护 / 人机审批：
  #   enabled: false —— 取消审批环节，所有工具直接放行（无人工值守/追求速度时用）；
  #   enabled: true  —— 开启审批，高风险工具（fill/click/pressKey/screenshot）需人工批准。
  tool-guard:
    enabled: false
    default-timeout-seconds: 60
    policies:
      # 只读工具：短超时，不需审批
      - names: [navigate, pageText, getText, listLinks, inspectForm, currentUrl, probePage, startNetworkCapture, stopNetworkCapture, u9Login]
        requires-approval: false
        timeout-seconds: 45
      # 交互类工具：中超时
      - names: [click, clickButton, fill, pressKey]
        requires-approval: false
        timeout-seconds: 30
      # 截图：长超时（文件 IO）
      - names: [screenshot]
        requires-approval: false
        timeout-seconds: 15
      # 提问工具：长等待（等人工响应）
      - names: [askUser]
        requires-approval: false
        timeout-seconds: 300
      # 文件工具
      - names: [readFile, writeFile, listFiles]
        requires-approval: false
        timeout-seconds: 15

# 可观测：健康检查与基本信息端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.agent: INFO

# 基于 Python 的向量化推理边车（经验/标注的语义召回）
agent:
  vector:
    # 是否启用向量相似度打分（禁用或服务不可用时自动回退 bigram）
    enabled: true
    base-url: ${VECTOR_BASE_URL:http://127.0.0.1:8000}
    timeout-ms: ${VECTOR_TIMEOUT_MS:8000}
