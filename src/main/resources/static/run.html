<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 执行过程 · 流式呈现</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --border: #e3e6ea;
      --text: #1f2329;
      --muted: #7a8089;
      --brand: #2f6bff;
      --brand-dark: #2454cc;
      --ok: #1f9d55;
      --bad: #d94444;
      --warn: #c78a00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 18px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row input[type=text] { flex: 1; min-width: 220px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; }
    button {
      background: var(--brand); color: #fff; border: none; border-radius: 8px;
      padding: 9px 16px; font-size: 14px; cursor: pointer; white-space: nowrap;
    }
    button:hover { background: var(--brand-dark); }
    button:disabled { background: #a9b4c9; cursor: not-allowed; }
    button.ghost { background: #fff; color: var(--muted); border: 1px solid var(--border); }
    button.ghost:hover { color: var(--text); background: #fafbfc; }
    button.ok-btn { background: var(--ok); }
    button.ok-btn:hover { background: #177a42; }
    button.bad-btn { background: var(--bad); }
    button.bad-btn:hover { background: #b53535; }
    .status { font-size: 13px; color: var(--muted); }
    .status.running::before {
      content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--brand); margin-right: 6px; animation: pulse 1s infinite;
    }
    .status.app-ok { color: var(--ok); white-space: nowrap; }
    .status.app-ok::before {
      content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--ok); margin-right: 6px;
    }
    .status.app-bad { color: var(--bad); white-space: nowrap; }
    .status.app-bad::before {
      content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--bad); margin-right: 6px;
    }
    .status.checking { color: var(--brand); white-space: nowrap; }
    .status.checking::before {
      content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--brand); margin-right: 6px; animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    /* 循环阶段指示 */
    .loop-strip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .phase {
      border: 1px solid var(--border); border-radius: 18px; padding: 5px 14px;
      font-size: 13px; color: var(--muted); background: #fff; display: flex; align-items: center; gap: 6px;
      transition: all .25s;
    }
    .phase .num {
      width: 18px; height: 18px; border-radius: 50%; background: #eef0f3; color: var(--muted);
      display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px;
    }
    .phase.active { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 3px rgba(47,107,255,.1); }
    .phase.active .num { background: var(--brand); color: #fff; }
    .phase.done { border-color: var(--ok); color: var(--ok); }
    .phase.done .num { background: var(--ok); color: #fff; }
    .arrow { color: var(--muted); font-size: 13px; }
    .loop-hint { color: var(--muted); font-size: 12.5px; margin: 2px 0 14px; }

    .cols { display: flex; gap: 14px; align-items: flex-start; }
    .col-main { flex: 1; min-width: 0; }
    .col-side { width: 340px; flex-shrink: 0; }
    @media (max-width: 900px) { .cols { flex-direction: column; } .col-side { width: 100%; } }

    /* 事件流卡片 */
    #timeline { display: flex; flex-direction: column; gap: 8px; }
    .evt-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; animation: slidein .3s ease;
    }
    @keyframes slidein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .evt-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .evt-title { font-weight: 600; font-size: 13.5px; }
    .tag { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12px; background: #eef2ff; color: var(--brand); }
    .tag.ok { background: #e6f7ee; color: var(--ok); }
    .tag.bad { background: #fdeaea; color: var(--bad); }
    .tag.warn { background: #fff4e0; color: var(--warn); }
    .tag.mut { background: #f0f1f3; color: var(--muted); }
    .evt-time { color: var(--muted); font-size: 12px; margin-left: auto; }
    .evt-body { font-size: 13.5px; word-break: break-word; white-space: pre-wrap; }
    .out-box {
      margin-top: 6px; background: #fafbfc; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font-size: 12.5px; max-height: 170px; overflow-y: auto; white-space: pre-wrap;
      word-break: break-word; font-family: inherit;
    }
    .out-box.open { max-height: none; }
    .more-btn { background: none; border: none; color: var(--brand); font-size: 12px; padding: 2px 0; cursor: pointer; }
    .step-list { margin: 4px 0 0; padding-left: 0; list-style: none; }
    .step-list li { padding: 3px 0; border-bottom: 1px dashed #f0f1f3; font-size: 13px; }
    .step-list li:last-child { border-bottom: none; }
    .step-no { color: var(--brand); font-weight: 600; margin-right: 6px; }
    .wave-divider {
      display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px;
      margin: 4px 0; animation: slidein .3s ease;
    }
    .wave-divider::before, .wave-divider::after { content: ""; flex: 1; border-top: 1px dashed var(--border); }
    .final-answer { background: #f0f6ff; border-color: #c7d9ff; }

    /* 经验面板 */
    .exp-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: #fff; }
    .exp-item.quality { border-color: var(--ok); background: #f4fcf7; }
    .exp-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
    .exp-name { font-weight: 600; font-size: 13px; word-break: break-all; }
    .exp-content { font-size: 12.5px; color: var(--muted); max-height: 120px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
    .exp-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .exp-actions { display: flex; gap: 6px; margin-left: auto; }
    .exp-actions button { padding: 3px 10px; font-size: 12px; border-radius: 6px; }
    .muted { color: var(--muted); }
    .cnt { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Agent 执行过程 · 流式呈现</h1>
    <p class="sub">递归闭环：获取信息 → 制定计划 → 执行操作 → 循环评估，直至目标达成；重复且经人工认可的信息沉淀为优质工作经验</p>

    <div class="card">
      <div class="row">
        <input type="text" id="goal" placeholder="输入总体目标，如：在用友U9 ERP中抓取料品列表数据并汇报">
        <button id="runBtn" onclick="startRun()">开始执行</button>
        <button class="ghost" onclick="loadExperiences()">刷新经验</button>
        <button class="ghost" id="appBtn" onclick="startBackendApp()">启动后端应用</button>
        <span class="status" id="appStatus">后端未检测</span>
        <span class="status" id="status">空闲</span>
      </div>
    </div>

    <div class="loop-strip" id="loopStrip">
      <div class="phase" data-p="0"><span class="num">1</span>获取信息</div>
      <span class="arrow">→</span>
      <div class="phase" data-p="1"><span class="num">2</span>制定计划</div>
      <span class="arrow">→</span>
      <div class="phase" data-p="2"><span class="num">3</span>执行操作</div>
      <span class="arrow">→</span>
      <div class="phase" data-p="3"><span class="num">4</span>循环评估</div>
      <span class="arrow">↺</span>
    </div>
    <p class="loop-hint">蓝色 = 当前阶段；执行轨迹按事件流实时渲染，终止状态见结尾汇总卡片</p>

    <div class="cols">
      <div class="col-main">
        <div id="timeline"></div>
      </div>
      <div class="col-side">
        <div class="card">
          <h2 style="font-size:15px;margin:0 0 4px">经验沉淀</h2>
          <p class="hint" style="color:var(--muted);font-size:12.5px;margin:0 0 10px">
            自动收集的执行经验先为候选；<b>重复出现 ≥2 次</b>且<b>经人工认可</b>后升级为优质经验，才会注入 Planner 参与后续规划
          </p>
          <div id="expList"><p class="muted">暂无经验，完成一次执行后自动收集。</p></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const EVENT_TYPES = [
    'run:started', 'run:plan', 'run:iteration', 'wave:started', 'wave:completed',
    'step:status', 'step:reflection', 'run:synthesis', 'run:completed', 'run:failed'
  ];
  let stepCards = {};
  let waveIdx = 0;

  function startRun() {
    const goal = document.getElementById('goal').value.trim();
    if (!goal) return;
    const timeline = document.getElementById('timeline');
    timeline.innerHTML = '';
    stepCards = {};
    waveIdx = 0;
    setStatus('运行中', true);
    document.getElementById('runBtn').disabled = true;
    setPhase(-1);
    const es = new EventSource('/api/agent/run/stream?goal=' + encodeURIComponent(goal));
    EVENT_TYPES.forEach(t => es.addEventListener(t, e => handleEvent(t, JSON.parse(e.data))));
    es.onclose = () => { setStatus('已结束', false); document.getElementById('runBtn').disabled = false; es.close(); };
    es.onerror = () => { setStatus('连接中断', false); document.getElementById('runBtn').disabled = false; es.close(); };
  }

  function setStatus(text, running) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status' + (running ? ' running' : '');
  }

  // ---------- 后端应用启动（幂等确保运行） ----------

  function startBackendApp() {
    const btn = document.getElementById('appBtn');
    const el = document.getElementById('appStatus');
    btn.disabled = true;
    el.textContent = '检测后端应用…';
    el.className = 'status checking';
    fetch('/api/app/start', { method: 'POST' })
      .then(r => r.json())
      .then(j => {
        const mins = j.uptimeMs != null ? Math.max(1, Math.round(j.uptimeMs / 60000)) : '?';
        el.textContent = `后端应用运行中 · PID ${j.pid} · 端口 ${j.port} · 已运行约 ${mins} 分钟`;
        el.className = 'status app-ok';
      })
      .catch(() => {
        // 应用停止时接口不可达：网页无法自举启动，指引本机冷启动脚本
        el.textContent = '后端未运行：网页无法自举启动已停止的后端，请双击项目目录 start-agent.bat 启动';
        el.className = 'status app-bad';
      })
      .finally(() => { btn.disabled = false; });
  }

  function setPhase(active, doneUpTo) {
    document.querySelectorAll('#loopStrip .phase').forEach((p, i) => {
      p.classList.remove('active', 'done');
      if (doneUpTo !== undefined && i <= doneUpTo) p.classList.add('done');
      else if (i === active) p.classList.add('active');
    });
  }

  function handleEvent(type, p) {
    if (type === 'run:started') { setPhase(0); addCard(goalCard(p)); }
    else if (type === 'run:plan') { setPhase(1); addCard(planCard(p)); }
    else if (type === 'run:iteration') { setPhase(1, 0); addCard(iterationCard(p)); }
    else if (type === 'wave:started') { setPhase(2, 1); addWave(p); }
    else if (type === 'wave:completed') { markWaveDone(p); }
    else if (type === 'step:status') { handleStep(p); }
    else if (type === 'step:reflection') { addCard(reflectionCard(p), true); }
    else if (type === 'run:synthesis') { addCard(synthesisCard(p)); }
    else if (type === 'run:completed') { setPhase(3, 3); addCard(completedCard(p)); setTimeout(loadExperiences, 1500); }
    else if (type === 'run:failed') { addCard(failedCard(p)); setTimeout(loadExperiences, 1500); }
    scrollBottom();
  }

  // ---------- 卡片构造 ----------

  function goalCard(p) {
    return baseCard('总体目标', '<span class="tag">开始</span>', `
      <div class="evt-body">${esc(p.goal || '')}</div>
      <div class="cnt" style="margin-top:4px">runId: ${esc(p.runId || '')}</div>`, p.ts);
  }

  function planCard(p) {
    const steps = (p.steps || []).map(s =>
      `<li><span class="step-no">#${s.step}</span>${esc(s.goal)} <span class="tag mut">${esc(s.worker || '自动分派')}</span></li>`).join('');
    return baseCard('首轮计划', '<span class="tag">规划</span>', `<ul class="step-list">${steps}</ul>`, p.ts);
  }

  function iterationCard(p) {
    const d = p.decision || 'CONTINUE';
    const cls = d === 'DONE' ? 'ok' : (d === 'ABORT' ? 'bad' : '');
    const next = (p.nextSteps || []).map(s =>
      `<li><span class="step-no">#${s.step}</span>${esc(s.goal)} <span class="tag mut">${esc(s.worker || '自动分派')}</span></li>`).join('');
    let body = `<div class="evt-body"><b>判定理由：</b>${esc(p.reason || '')}</div>`;
    if (next) body += `<div style="margin-top:6px"><b style="font-size:13px">下一批步骤：</b><ul class="step-list">${next}</ul></div>`;
    return baseCard(`第 ${p.iteration} 轮 · 观察与决策`, `<span class="tag ${cls}">${d}</span>`, body, p.ts);
  }

  function handleStep(p) {
    const key = 's' + p.step;
    let card = stepCards[key];
    const status = p.status || '';
    const cls = status === 'SUCCESS' ? 'ok' : (status === 'FAILED' ? 'bad' : '');
    const body = `
      <div class="evt-body"><b>步骤 #${p.step}</b> · 执行者 <span class="tag mut">${esc(p.worker || '')}</span></div>
      ${p.output ? `<div class="out-box" id="out-${key}">${esc(p.output)}</div>
        <button class="more-btn" onclick="toggleOut('out-${key}', this)">展开全部 ▾</button>` : ''}
      ${p.reflections ? `<div class="cnt" style="margin-top:4px">反思增强 ${p.reflections} 次</div>` : ''}`;
    if (card) {
      card.innerHTML = cardInner(`执行步骤 #${p.step}`, `<span class="tag ${cls}">${status}</span>`, body, p.ts);
    } else {
      card = addCard(baseCard(`执行步骤 #${p.step}`, `<span class="tag ${cls}">${status}</span>`, body, p.ts));
      stepCards[key] = card;
    }
  }

  function reflectionCard(p) {
    return baseCard('步骤反思', '<span class="tag warn">反思</span>', `
      <div class="evt-body"><b>批评：</b>${esc(p.critique || '')}</div>
      <div class="evt-body" style="margin-top:4px"><b>下一步：</b>${esc(p.nextAction || '')}</div>`, p.ts);
  }

  function synthesisCard(p) {
    return baseCard('最终汇总', '<span class="tag">汇总</span>',
      `<div class="out-box open">${esc(p.finalAnswer || '')}</div>`, p.ts, 'final-answer');
  }

  function completedCard(p) {
    const st = p.stats || {};
    const term = { DONE: '目标达成', ABORT: '目标无法达成（中止）', MAX_ITERATIONS: '达到轮数上限' }[p.termination] || p.termination;
    const el = (p.election || {});
    return baseCard('运行完成', '<span class="tag ok">完成</span>', `
      <div class="evt-body">
        递归循环 <b>${p.iterations || '-'}</b> 轮 · 终止状态 <b>${esc(term)}</b><br>
        步骤统计：成功 ${st.success ?? '-'} / 失败 ${st.failed ?? '-'} / 反思 ${st.reflections ?? '-'}<br>
        本轮管理者当选：<b>${esc(el.winner || '-')}</b>
      </div>`, p.ts);
  }

  function failedCard(p) {
    return baseCard('运行失败', '<span class="tag bad">失败</span>',
      `<div class="evt-body">${esc(p.error || '')}</div>`, p.ts);
  }

  function addWave(p) {
    waveIdx++;
    const div = document.createElement('div');
    div.className = 'wave-divider';
    div.id = 'wave-' + (p.wave ?? waveIdx);
    div.innerHTML = `<span>第 ${p.wave ?? waveIdx} 波执行 · 步骤 ${(p.stepNums || []).join(', ') || ''}</span>`;
    document.getElementById('timeline').appendChild(div);
    return div;
  }

  function markWaveDone(p) {
    const el = document.getElementById('wave-' + (p.wave ?? ''));
    if (el) el.innerHTML = `<span style="color:var(--ok)">✓ 第 ${p.wave} 波完成</span>`;
  }

  // ---------- 卡片骨架 ----------

  function cardInner(title, tagHtml, bodyHtml, ts, extraCls) {
    return `<div class="evt-head"><span class="evt-title">${title}</span>${tagHtml}
      <span class="evt-time">${fmtTime(ts)}</span></div>${bodyHtml}`;
  }

  function baseCard(title, tagHtml, bodyHtml, ts, extraCls) {
    const div = document.createElement('div');
    div.className = 'evt-card' + (extraCls ? ' ' + extraCls : '');
    div.innerHTML = cardInner(title, tagHtml, bodyHtml, ts);
    document.getElementById('timeline').appendChild(div);
    return div;
  }

  function toggleOut(id, btn) {
    const el = document.getElementById(id);
    if (el.classList.toggle('open')) btn.textContent = '收起 ▴';
    else btn.textContent = '展开全部 ▾';
  }

  function scrollBottom() {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function fmtTime(ts) { return ts ? new Date(ts).toLocaleTimeString() : ''; }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---------- 经验沉淀面板 ----------

  function loadExperiences() {
    fetch('/api/experiences')
      .then(r => r.json())
      .then(list => renderExperiences(list || []))
      .catch(() => {});
  }

  function renderExperiences(list) {
    const box = document.getElementById('expList');
    if (!list.length) { box.innerHTML = '<p class="muted">暂无经验，完成一次执行后自动收集。</p>'; return; }
    box.innerHTML = list.map(e => {
      const typeName = e.type === 'PITFALL' ? '教训' : '经验';
      let state;
      if (e.quality) state = '<span class="tag ok">优质经验</span>';
      else if (e.approved === 'APPROVED') state = `<span class="tag">已认可 · 待重复（${e.repeatCount}/2）</span>`;
      else if (e.approved === 'REJECTED') state = '<span class="tag bad">已否决</span>';
      else if (e.repeatCount >= 2) state = '<span class="tag warn">重复达标 · 待认可</span>';
      else state = `<span class="tag mut">候选（${e.repeatCount}/2）</span>`;
      const actions = e.approved === 'REJECTED' ? '' :
        `<div class="exp-actions">
           <button class="ok-btn" onclick="approveExp('${e.id}')">认可</button>
           <button class="bad-btn" onclick="rejectExp('${e.id}')">否决</button>
         </div>`;
      return `<div class="exp-item${e.quality ? ' quality' : ''}">
        <div class="exp-head"><span class="tag mut">${typeName}</span>${state}
          <span class="cnt">重复 ${e.repeatCount} 次</span></div>
        <div class="exp-name">${esc(e.name || '')}</div>
        <div class="exp-content">${esc(e.content || '')}</div>
        <div class="exp-meta">${actions}</div>
      </div>`;
    }).join('');
  }

  function approveExp(id) {
    fetch('/api/experiences/' + id + '/approve', { method: 'POST' })
      .then(() => loadExperiences()).catch(() => {});
  }
  function rejectExp(id) {
    fetch('/api/experiences/' + id + '/reject', { method: 'POST' })
      .then(() => loadExperiences()).catch(() => {});
  }

  loadExperiences();
  startBackendApp();
</script>
</body>
</html>
